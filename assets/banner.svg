<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0718" />
      <stop offset="50%" stop-color="#120c29" />
      <stop offset="100%" stop-color="#1e0b36" />
    </linearGradient>

    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffd200" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(60px, -30px) scale(1.15); opacity: 0.6; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(-50px, 40px) scale(1.2); opacity: 0.65; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    }
    @keyframes pulseWave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.3); }
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.28; }
    }
    .orb-cyan { animation: floatOrb1 7s ease-in-out infinite; transform-origin: center; }
    .orb-pink { animation: floatOrb2 9s ease-in-out infinite; transform-origin: center; }
    .grid-lines { animation: gridPulse 5s ease-in-out infinite; }
    .bar-1 { animation: pulseWave 1.2s ease-in-out infinite alternate; transform-origin: bottom; }
    .bar-2 { animation: pulseWave 1.6s ease-in-out infinite 0.2s alternate; transform-origin: bottom; }
    .bar-3 { animation: pulseWave 1.4s ease-in-out infinite 0.4s alternate; transform-origin: bottom; }
    .bar-4 { animation: pulseWave 1.8s ease-in-out infinite 0.1s alternate; transform-origin: bottom; }
    .bar-5 { animation: pulseWave 1.3s ease-in-out infinite 0.5s alternate; transform-origin: bottom; }
  </style>

  <!-- Deep Sci-Fi Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in the background -->
  <g>
    <circle cx="200" cy="120" r="140" fill="#00f2fe" filter="url(#glowCyan)" class="orb-cyan" />
    <circle cx="1020" cy="280" r="160" fill="#ff007f" filter="url(#glowPink)" class="orb-pink" />
    <circle cx="600" cy="380" r="100" fill="#7928ca" filter="url(#glowPink)" class="orb-cyan" />
  </g>

  <!-- Perspective Cyber Grid in lower background -->
  <g class="grid-lines" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="365" x2="1200" y2="365" />
    <line x1="0" y1="385" x2="1200" y2="385" />
    <line x1="100" y1="400" x2="350" y2="320" />
    <line x1="250" y1="400" x2="450" y2="320" />
    <line x1="450" y1="400" x2="550" y2="320" />
    <line x1="750" y1="400" x2="650" y2="320" />
    <line x1="950" y1="400" x2="750" y2="320" />
    <line x1="1100" y1="400" x2="850" y2="320" />
  </g>

  <!-- Dynamic Audio Waveform Visualizer (Lipsync/Voice Animation) -->
  <g transform="translate(60, 310)" fill="url(#neonCyanGrad)" opacity="0.75">
    <rect class="bar-1" x="0" y="-30" width="4" height="30" rx="2" />
    <rect class="bar-2" x="8" y="-45" width="4" height="45" rx="2" />
    <rect class="bar-3" x="16" y="-60" width="4" height="60" rx="2" />
    <rect class="bar-4" x="24" y="-35" width="4" height="35" rx="2" />
    <rect class="bar-5" x="32" y="-50" width="4" height="50" rx="2" />
    <rect class="bar-2" x="40" y="-25" width="4" height="25" rx="2" />
    <rect class="bar-1" x="48" y="-40" width="4" height="40" rx="2" />
  </g>

  <g transform="translate(1090, 310)" fill="url(#neonPinkGrad)" opacity="0.75">
    <rect class="bar-3" x="0" y="-35" width="4" height="35" rx="2" />
    <rect class="bar-1" x="8" y="-55" width="4" height="55" rx="2" />
    <rect class="bar-4" x="16" y="-30" width="4" height="30" rx="2" />
    <rect class="bar-2" x="24" y="-65" width="4" height="65" rx="2" />
    <rect class="bar-5" x="32" y="-40" width="4" height="40" rx="2" />
    <rect class="bar-1" x="40" y="-20" width="4" height="20" rx="2" />
  </g>

  <!-- Clear Dark Foreground Overlay for Crisp Text Readability -->
  <rect x="100" y="45" width="1000" height="270" rx="24" fill="#0b0818" fill-opacity="0.72" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Foreground Title and Content (Always Crisp and Fully Legible) -->
  <g text-anchor="middle">
    <!-- Top Badge / Pill -->
    <rect x="475" y="65" width="250" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
    <text x="600" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">⚡ CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Digital Human &amp; Virtual Idol
    </text>
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="0">
      Animation SDKs &amp; AI Avatars
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#b4b9d2">
      Real-Time Lip-Sync • Talking-Head Synthesis • 3D VRM/Live2D • WebRTC AI Digital Twins
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 280)">
      <rect x="-310" y="-12" width="135" height="24" rx="12" fill="#1b1735" stroke="#7928ca" stroke-width="1" />
      <text x="-242" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2bbf7">🎙️ Audio-Driven</text>

      <rect x="-160" y="-12" width="150" height="24" rx="12" fill="#1b1735" stroke="#00f2fe" stroke-width="1" />
      <text x="-85" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#88f7ff">⚡ Real-Time WebRTC</text>

      <rect x="5" y="-12" width="145" height="24" rx="12" fill="#1b1735" stroke="#ff007f" stroke-width="1" />
      <text x="77" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffa3cf">🎭 3D VRM / Live2D</text>

      <rect x="165" y="-12" width="145" height="24" rx="12" fill="#1b1735" stroke="#ffd200" stroke-width="1" />
      <text x="237" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffea88">🤖 Autonomous Agents</text>
    </g>
  </g>
</svg>